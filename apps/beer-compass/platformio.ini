; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.1
	adafruit/Adafruit SSD1306@^2.5.15
	; Monorepo libraries, linked in place so edits under libs/ are picked up
	; on the next build. Paths are relative to this file. Every internal
	; library the app uses must be listed here, including transitive ones
	; (e.g. core for result.h); a missing entry fails the build with a
	; missing-header error.
	symlink://../../libs/core
	symlink://../../libs/hal/clock
	symlink://../../libs/hal/i2c
	symlink://../../libs/hal/serial
	symlink://../../libs/sensors/mpu6500
	symlink://../../libs/sensors/neo6m
	symlink://../../libs/sensors/qmc5883l
